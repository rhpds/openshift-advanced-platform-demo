# PostgreSQL ${{ values.version }} for ${{ values.owner }}: ${{ values.description }}
apiVersion: v1
kind: Secret
metadata:
  name: ${{ values.name }}-credentials
  namespace: ${{ values.namespace }}
  annotations:
    # rotate through Vault + External Secrets after the merge (platform standard)
    platform.parasol.io/managed-by: request-postgresql-database
stringData:
  POSTGRESQL_DATABASE: ${{ values.name }}
  POSTGRESQL_USER: ${{ values.name }}
  POSTGRESQL_PASSWORD: change-me-through-vault
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${{ values.name }}-data
  namespace: ${{ values.namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: ${{ values.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.namespace }}
  labels:
    app: ${{ values.name }}
    app.kubernetes.io/part-of: ${{ values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${{ values.name }}
  template:
    metadata:
      labels:
        app: ${{ values.name }}
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-${{ values.version }}:latest
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: ${{ values.name }}-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ${{ values.name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.namespace }}
spec:
  selector:
    app: ${{ values.name }}
  ports:
    - port: 5432
      targetPort: 5432
