{{- if .Values.noobaa.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" .Values.noobaa.name "namespace" .Values.argocd.namespace "syncWave" "0") }}
spec:
  destination:
    namespace: {{ .Values.noobaa.namespace }}
    server: https://kubernetes.default.svc
  project: default
  ignoreDifferences:
    - group: noobaa.io
      kind: NooBaa
      jsonPointers:
        - /metadata/labels
        - /spec/coreResources
        - /spec/dbResources
        - /spec/endpoints
  source:
    path: automation/gitops/noobaa
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    helm:
      valuesObject:
        noobaa-operator:
          noobaa:
            subscription:
              source: {{ include "app-of-apps.operatorSource" . }}
{{- if .Values.noobaa.operator_channel }}
              channel: {{ .Values.noobaa.operator_channel }}
{{- end }}
        noobaa:
          nameOverride: {{ .Values.noobaa.name }}
{{- if .Values.noobaa.storage_class }}
          backingStore:
            storageClass: {{ .Values.noobaa.storage_class }}
{{- end }}
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
{{- end }}
