project:
  slug: openshift-advanced-platform-demo
  owner_email: mnagel@redhat.com
  content_type: lab
  deployment_mode: rhdp_published
  initiative_key: rh1_2027
  showroom_type: classic
  intake_type: migration
  automation_type: both
  description: >-
    A 2-hour instructor-led enablement session for Red Hat SAs and technical sellers
    to learn how to deliver the OpenShift Advanced App Platform demo. The session
    runs in a group format: 100 attendees break into 20 groups of 5. Each group
    receives one pre-provisioned RHDP demo instance (ocp4-adv-app-platform-demo);
    one group member drives at any time while the others observe. The instructor
    walks through the full demo at the front of the room and each group's driver
    follows along live. Participants leave ready to deliver the demo to customers.
  jira_ticket: RHDPCD-1123
  workflow_id: e5992e4f-81cf-4201-854e-73b8e30dfd52
spec:
  title: 'Delivering the Advanced App Platform Demo: An Enablement Lab for Red Hat SAs'
  learning_objectives:
    - Describe the Parasol Insurance business narrative and connect each demo section to measurable customer business outcomes
    - Follow along with the instructor through all three demo sections in a shared live RHDP environment, building familiarity with the navigation flow and key talking points
    - Recall the differentiation messages and objection responses for each of the three demo sections
    - Identify which sections to prioritize given different customer contexts and time constraints
    - Practice the full demo independently using the RHDP live environment after the session
  modules:
    - id: module-01
      title: "Demo Overview: Story, Structure, and Customer Message"
      duration_min: 15
      status: not_started
    - id: module-02
      title: "Group Formation and Instance Setup"
      duration_min: 10
      status: not_started
    - id: module-03
      title: "Section 1 Live Walkthrough: Foundational App Platform"
      duration_min: 30
      status: not_started
    - id: module-04
      title: "Section 2 Live Walkthrough: Advanced Developer Services"
      duration_min: 30
      status: not_started
    - id: module-05
      title: "Section 3 Live Walkthrough: Intelligent Applications"
      duration_min: 25
      status: not_started
