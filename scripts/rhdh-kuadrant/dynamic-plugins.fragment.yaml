
  # --- added by openshift-advanced-platform-demo (RHCL / Kuadrant) ---
  # RBAC management UI; the permission framework is required by the Kuadrant plugin
  - package: ./dynamic-plugins/dist/backstage-community-plugin-rbac
    disabled: false
  # Kuadrant (Red Hat Connectivity Link) Developer Hub plugins, published 0.4.0
  # https://github.com/Kuadrant/kuadrant-backstage-plugin/blob/main/docs/installation.md
  - package: '@kuadrant/kuadrant-backstage-plugin-backend-dynamic@0.4.0'
    integrity: 'sha512-OOkfAbnFxuOkBjvQMUqkd/TtP/yrXr15yQ/Xel880kdgZk39CPlQzVdOS3VXmcLa/Y9toI9nTbyCNqtXAD2C/g=='
    disabled: false
  - package: '@kuadrant/kuadrant-backstage-plugin-frontend@0.4.0'
    integrity: 'sha512-ewW/eOoHcK8MqmhyGzFQvnU8yQkvRpQxhb/GLZbAyWwWpmA/zju2qwFWXx49eBcy9RIlfO2rwS8sQC7do3dfGA=='
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          internal.plugin-kuadrant:
            apiFactories:
              - importName: kuadrantApiFactory
            appIcons:
              - name: kuadrantIcon
                importName: KuadrantIcon
            dynamicRoutes:
              - path: /kuadrant
                importName: KuadrantPage
              - path: /kuadrant/api-products
                importName: ApiProductsPage
                menuItem:
                  icon: kuadrantIcon
                  text: API Products
              - path: /kuadrant/my-api-keys
                importName: MyApiKeysPage
                menuItem:
                  icon: kuadrantIcon
                  text: My API Keys
              - path: /kuadrant/api-key-approval
                importName: ApiKeyApprovalPage
                menuItem:
                  icon: kuadrantIcon
                  text: API Key Approval
              - path: /kuadrant/api-products/:namespace/:name
                importName: ApiProductDetailPage
              - path: /kuadrant/api-keys/:namespace/:name
                importName: ApiKeyDetailPage
            menuItems:
              kuadrant:
                icon: kuadrantIcon
                title: Connectivity Link
              kuadrant.api-products:
                parent: kuadrant
              kuadrant.my-api-keys:
                parent: kuadrant
              kuadrant.api-key-approval:
                parent: kuadrant
            mountPoints:
              - mountPoint: entity.page.api/cards
                importName: EntityKuadrantApiKeyManagementTab
                config:
                  layout:
                    gridColumn: "1 / -1"
                  if:
                    allOf:
                      - isKind: api
              - mountPoint: entity.page.api/cards
                importName: EntityKuadrantApiProductInfoContent
                config:
                  layout:
                    gridColumn: "1 / -1"
                  if:
                    allOf:
                      - isKind: api
