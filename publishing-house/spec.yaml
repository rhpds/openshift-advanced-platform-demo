# Publishing House — Project Spec
# Lifecycle: intake → content_review → infra_review → jira_sync → development → ready → published
# No secrets in this file. Tokens live in ~/.config/publishing-house/auth.json
# Stage is managed by SonataFlow and cached in .ph-state — do not edit stage.current manually.
# NOTE: This file is also in the template repo. The Scaffolder overlays project.* values.
# TODO: Eliminate this copy — Scaffolder should pull from template repo directly.

project:
  slug: "openshift-advanced-platform-demo"
  owner_email: "mnagel@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "classic"
  intake_type: "migration"
  automation_type: "both"
  description: "An exact copy of the https://catalog.demo.redhat.com/catalog/babylon-catalog-prod?item=babylon-catalog-prod/published.ocp4-adv-app-platform-demo.prod demo CI. The goal of the lab is attendee enablement on this CI and how to effectively demo it."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1123"
  workflow_id: "e5992e4f-81cf-4201-854e-73b8e30dfd52"

spec:
  title: "OpenShift Advanced Application Platform Demo Lab"
  learning_objectives:
    - "Demonstrate the OpenShift developer inner loop using Dev Spaces and Quarkus dev mode to build and test application features"
    - "Deploy applications through automated CI/CD pipelines using Red Hat OpenShift Pipelines and Red Hat OpenShift GitOps"
    - "Configure platform operations including service mesh traffic policies, autoscaling, and external secrets management"
    - "Explore Red Hat Developer Hub software catalog and provision applications using golden path templates"
    - "Secure the software supply chain using image scanning, SBOM generation, artifact signing, and policy validation"
    - "Integrate AI-powered capabilities into a Quarkus application using LLM endpoints and LangChain4j"
  modules:
    - id: module-01
      title: "Developer Experience"
      duration_min: 30
      status: not_started
    - id: module-02
      title: "CI/CD Pipeline"
      duration_min: 15
      status: not_started
    - id: module-03
      title: "Platform Operations"
      duration_min: 20
      status: not_started
    - id: module-04
      title: "Developer Hub"
      duration_min: 15
      status: not_started
    - id: module-05
      title: "Secure Development"
      duration_min: 15
      status: not_started
    - id: module-06
      title: "Trusted Software Supply Chain"
      duration_min: 10
      status: not_started
    - id: module-07
      title: "AI-Enhanced Applications"
      duration_min: 15
      status: not_started
  environment:
    platform: "ocp"            # ocp | rhel-vms — determines which sizing fields apply
    topology: "per-student"    # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | troshka — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "4.20"                # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: "multinode"          # sno | multinode — only for platform = ocp
    control_plane_instance_count: null # 1 if sno, 3 if multinode
    control_plane_cpu: null            # 32 if sno, 16 if multinode
    control_plane_ram_gb: null         # 128 if sno, 64 if multinode
    worker_count: null                 # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: "maas"             # maas | gpu | none
    ai_model_tier: "open-source"       # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: "qwen3-235b"        # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services:
      - "registry.devfile.io"
      - "LiteMaaS LLM endpoint"
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 2.5
  audience: "advanced"         # beginner | intermediate | advanced

development:
  automation:
    gitops:
      status: not_started
    ansible:
      status: not_started
  e2e:
    status: not_started
  healthCheck:
    status: not_started

compliance:
  last_hard_check: null
  hard_result: null

tracking:
  paused: false
  pause_reason: null

# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: ""
    catalog_gap: ""
    design_overview: "A 2.5-hour advanced hands-on lab enabling sales engineers and solution architects to deliver the OpenShift Advanced Application Platform demo. Covers seven modules spanning the full application lifecycle: developer inner loop (Dev Spaces, Quarkus), CI/CD (Tekton, Argo CD), platform operations (Service Mesh, autoscaling, Vault), Developer Hub self-service, software supply chain security (ACS, TAS, Tekton Chains, Conforma), and AI-enhanced applications (LangChain4j, LLM integration)."
    module_summaries:
      - title: "Developer Experience"
        overview: "Demonstrates the developer inner loop on OpenShift using Dev Spaces one-click workspaces and Quarkus dev mode, including MTA positioning and Dev Spaces governance from the platform engineer persona."
      - title: "CI/CD Pipeline"
        overview: "Walks through an automated CI/CD pipeline triggered by a Git push: Tekton build, SonarQube code quality gates with AI-assisted fixes, and GitOps delivery to production using Argo CD."
      - title: "Platform Operations"
        overview: "Covers platform engineering concerns including Service Mesh mTLS and traffic policies, Kiali observability with fault injection, HPA autoscaling under load, and external secrets management with Vault."
      - title: "Developer Hub"
        overview: "Showcases Red Hat Developer Hub as a self-service portal: Developer Lightspeed AI assistant, software catalog exploration, and golden path template provisioning for new applications."
      - title: "Secure Development"
        overview: "Introduces secure development workflow with Dependency Analytics IDE scanning and a hardened build pipeline featuring ACS image scanning, SBOM generation, Tekton Chains signing, and Conforma policy validation."
      - title: "Trusted Software Supply Chain"
        overview: "Deep dive into the TPA SBOM dashboard for dependency analysis and vulnerability correlation, concluding with an OpenShift topology view that ties together the full application lifecycle."
      - title: "AI-Enhanced Applications"
        overview: "Implements LLM-powered email triage routing using Quarkus LangChain4j and deploys the AI-enhanced feature through the same secure CI/CD pipeline demonstrated in earlier modules."
    rcars_overlap_pct: 100
    rcars_top_matches:
      - title: "OpenShift Advanced App Platform Demo"
        ci_name: "published.ocp4-adv-app-platform-demo.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.ocp4-adv-app-platform-demo.prod"
        relevance_score: 100
        why_it_fits: "This is the exact demo CI being migrated. The lab is an intentional 1:1 copy for Red Hat One seller enablement — each attendee gets a dedicated instance to learn how to deliver this demo."
      - title: "Service Enablement: App Platform Software Factory"
        ci_name: "openshift-cnv.app-platform-factory-cnv.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=openshift-cnv.app-platform-factory-cnv.prod"
        relevance_score: 77
        why_it_fits: "Covers most of the same technologies through an advanced hands-on workshop but lacks ACS and Service Mesh, and is a multi-day format."
        workloads:
          - role: "ocp4_workload_authentication"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_gitops_bootstrap"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_openshift_gitops"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_showroom"
            collection: "agnosticd.showroom"
      - title: "OpenShift Dev Day Roadshow"
        ci_name: "published.ocp-dev-days-rdshw.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.ocp-dev-days-rdshw.prod"
        relevance_score: 74
        why_it_fits: "Covers Developer Hub, Dev Spaces, Pipelines, and GitOps but at beginner level, missing Service Mesh, ACS, AMQ Streams, TAS, TPA, and AI/LLM."
    catalog_gap: "Intentional 1:1 copy of published.ocp4-adv-app-platform-demo.prod for Red Hat One seller enablement. Each attendee gets a dedicated per-student instance to learn how to effectively deliver the existing demo. Overlap is by design."
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: ""
    agnosticv_base_ci: ""
    approved_by: ""
    rejections: []
