spec:
  title: 'Delivering the Advanced App Platform Demo: An Enablement Lab for Red Hat SAs'
  learning_objectives:
    - Demonstrate the Parasol Insurance business narrative end-to-end, connecting each demo section to measurable customer business outcomes
    - Analyze customer signals to configure the demo scope and module sequence for different audience personas and time constraints
    - Explore the key talking points, differentiation messages, and objection responses for each of the three demo sections
    - Verify the demo environment using the pre-demo checklist and troubleshoot common setup issues before a customer delivery
    - Demonstrate one complete demo module end-to-end independently in the RHDP live demo CI environment
  modules:
    - id: module-01
      title: "Demo Narrative and Delivery Preparation"
      duration_min: 20
      status: not_started
    - id: module-02
      title: "Section 1 Highlights: Foundational App Platform"
