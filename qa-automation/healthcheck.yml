---
# HEALTHCHECK — Quick environment readiness check
# Runs post-provisioning to verify the OpenShift Advanced App Platform demo
# environment is functional before an instructor-led session.
#
# Non-destructive: only reads cluster state (no mutations). Targets a run time
# under ~60 seconds. Uses the ambient KUBECONFIG / in-cluster credentials the
# way the provisioning role does (kubernetes.core.k8s_info, no explicit auth).
#
# Exit 0 = healthy, non-zero = unhealthy.
#
# Scope: cluster-level readiness plus the GitOps delivery layer that stands up
# every platform component for this demo. Deep per-module component checks live
# in e2e.yml.

- name: "OpenShift Advanced App Platform — environment health check"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Namespaces the demo relies on being present. These are created by the
    # app-of-apps GitOps tree (see automation/gitops/app-of-apps/values.yaml).
    healthcheck_required_namespaces:
      - openshift-gitops
      - openshift-devspaces
      - gitlab
      - keycloak
      - quay-registry
      - rhdh
      - stackrox
      - trusted-profile-analyzer
      - trusted-artifact-signer
      - vault
      - external-secrets
      - sonarqube
      - parasol-insurance-dev
  tasks:
    - name: "Cluster API — read ClusterVersion"
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: ClusterVersion
        name: version
      register: r_clusterversion
      retries: 3
      delay: 5
      until: r_clusterversion is not failed

    - name: "Cluster API — assert cluster is Available"
      ansible.builtin.assert:
        that:
          - r_clusterversion.resources | length == 1
          - >-
            r_clusterversion.resources[0].status.conditions
            | selectattr('type', 'equalto', 'Available')
            | selectattr('status', 'equalto', 'True')
            | list | length == 1
        fail_msg: "ClusterVersion is not reporting Available=True — the OCP API/cluster is not ready."
        success_msg: >-
          Cluster {{ r_clusterversion.resources[0].status.desired.version | default('unknown') }} is Available.

    - name: "Nodes — list all nodes"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
      register: r_nodes

    - name: "Nodes — assert every node is Ready"
      vars:
        # A node is Ready when it has a status condition type=Ready status=True.
        # map('list')|select drops nodes with no matching condition (empty list).
        _ready_nodes: >-
          {{ r_nodes.resources
             | selectattr('status.conditions', 'defined')
             | map(attribute='status.conditions')
             | map('selectattr', 'type', 'equalto', 'Ready')
             | map('selectattr', 'status', 'equalto', 'True')
             | map('list') | select | list }}
      ansible.builtin.assert:
        that:
          - r_nodes.resources | length > 0
          - (_ready_nodes | length) == (r_nodes.resources | length)
        fail_msg: >-
          Not all nodes are Ready ({{ _ready_nodes | length }}/{{ r_nodes.resources | length }} Ready).
        success_msg: "All {{ r_nodes.resources | length }} nodes are Ready."

    - name: "Namespaces — read required namespaces"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: "{{ _ns }}"
      loop: "{{ healthcheck_required_namespaces }}"
      loop_control:
        loop_var: _ns
        label: "{{ _ns }}"
      register: r_namespaces

    - name: "Namespaces — assert all required namespaces exist"
      vars:
        _missing: >-
          {{ r_namespaces.results
             | selectattr('resources', 'defined')
             | selectattr('resources', 'equalto', [])
             | map(attribute='_ns') | list }}
      ansible.builtin.assert:
        that:
          - _missing | length == 0
        fail_msg: "Missing required namespaces: {{ _missing | join(', ') }}"
        success_msg: "All {{ healthcheck_required_namespaces | length }} required namespaces are present."

    - name: "GitOps — argocd-server deployment is available"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: openshift-gitops
        name: openshift-gitops-server
      register: r_argocd_server
      retries: 3
      delay: 5
      until:
        - r_argocd_server.resources | default([]) | length == 1
        - (r_argocd_server.resources[0].status.availableReplicas | default(0)) | int >= 1

    - name: "GitOps — read app-of-apps child Applications"
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: openshift-gitops
        label_selectors:
          - app.kubernetes.io/part-of=app-of-apps
      register: r_apps

    - name: "GitOps — assert child Applications were discovered"
      ansible.builtin.assert:
        that:
          - r_apps.resources | default([]) | length > 0
        fail_msg: "No app-of-apps child Applications found in openshift-gitops — GitOps bootstrap has not run."
        success_msg: "Discovered {{ r_apps.resources | length }} child ArgoCD Applications."

    - name: "GitOps — assert all child Applications are Synced and Healthy"
      vars:
        _degraded: >-
          {{ r_apps.resources
             | selectattr('status', 'defined')
             | rejectattr('status.health.status', 'equalto', 'Healthy')
             | map(attribute='metadata.name') | list }}
        _out_of_sync: >-
          {{ r_apps.resources
             | selectattr('status', 'defined')
             | rejectattr('status.sync.status', 'equalto', 'Synced')
             | map(attribute='metadata.name') | list }}
      ansible.builtin.assert:
        that:
          - _degraded | length == 0
          - _out_of_sync | length == 0
        fail_msg: >-
          GitOps not fully converged.
          Not Healthy: {{ _degraded | default([]) | join(', ') | default('none') }}.
          Not Synced: {{ _out_of_sync | default([]) | join(', ') | default('none') }}.
        success_msg: "All {{ r_apps.resources | length }} ArgoCD Applications are Synced and Healthy."

    - name: "Health check summary"
      ansible.builtin.debug:
        msg: >-
          HEALTHY — cluster Available, all nodes Ready, required namespaces present,
          and {{ r_apps.resources | length }} ArgoCD Applications Synced/Healthy.
