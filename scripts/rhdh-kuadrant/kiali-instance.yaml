apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali-rhdh
  namespace: istio-system
  labels:
    parasol.rhdp.io/layer: rhdh-kiali-plugin
spec:
  istio_namespace: istio-system
  auth:
    strategy: token
  deployment:
    instance_name: kiali-rhdh
    namespace: istio-system
    view_only_mode: true
    cluster_wide_access: true
  external_services:
    istio:
      config_map_name: istio-default
      istiod_deployment_name: istiod-default
      istio_sidecar_injector_config_map_name: istio-sidecar-injector-default
    prometheus:
      url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
      auth:
        type: bearer
        use_kiali_token: true
    tracing:
      enabled: false
    grafana:
      enabled: false
