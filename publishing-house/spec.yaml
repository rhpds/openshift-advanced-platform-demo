approval_checklist:
  content:
    prerequisites_verifiable: false
    assessment_strategy: >-
      No formal assessment. Formative only: real-time Q&A during the session surfaces
      comprehension gaps; post-session, participants self-assess readiness by completing
      at least one independent practice run of their target section(s) using their own
      RHDP instance before a first customer delivery.
    catalog_gap: ''
    design_overview: >-
      A 2-hour instructor-led enablement session for Red Hat SAs and technical sellers to learn how to
      deliver the OpenShift Advanced App Platform demo. The session opens with a 15-minute demo overview
      covering the Parasol Insurance narrative, section structure, and core customer messages, followed
      by 10 minutes of group formation where 100 attendees break into 20 groups of 5, each receiving a
      shared pre-provisioned RHDP instance. The remainder of the session is the instructor delivering the
      full demo live while each group's driver follows along. Q&A is embedded at the end of each section.
      Reaching Section 2 is the minimum viable outcome; Section 3 is time-permitting, with SAs encouraged
      to continue independently after the event.
    module_summaries:
      - title: "Demo Overview: Story, Structure, and Customer Message"
        overview: >-
          Instructor frames the Parasol Insurance business narrative, explains the three-section
          structure, and highlights the core customer messages and differentiation angles for each
          section. Participants leave the overview knowing what the demo proves to a customer and
          how the sections connect.
      - title: "Group Formation and Instance Setup"
        overview: >-
          Attendees self-organise into groups of 5. Each group receives a single set of RHDP
          credentials for their pre-provisioned demo instance, nominates a starting driver, and
          verifies login access. Sets the expectation that the driver role can rotate at any point.
      - title: "Section 1 Live Walkthrough: Foundational App Platform"
        overview: >-
          Instructor delivers Section 1 live while each group's driver follows along in their
          shared RHDP instance. Covers the developer inner loop (Dev Spaces, MTA), CI/CD pipeline
          security (SonarQube SAST failure, Roo Code AI fix), Argo CD GitOps delivery, and platform
          operations (Kiali, HPA, Vault external secrets). Q&A at the end.
      - title: "Section 2 Live Walkthrough: Advanced Developer Services"
        overview: >-
          Instructor delivers Section 2 live while groups follow along. Covers Developer Hub
          Lightspeed, self-service template provisioning, Dependency Analytics CVE detection, the
          secure Tekton pipeline (ACS, Syft SBOM, TAS, Conforma), and TPA supply chain traceability.
          Q&A at the end. Minimum viable endpoint if the session runs short on time.
      - title: "Section 3 Live Walkthrough: Intelligent Applications"
        overview: >-
          Instructor delivers Section 3 live while groups follow along. Covers OpenShift AI
          positioning, RHDH self-service AI provisioning, and the LangChain4j intelligent email
          routing application. Q&A at the end. Time-permitting — SAs who do not reach this section
          are encouraged to practice it independently using their own RHDP instance after the event.
    rcars_overlap_pct: 93
    rcars_top_matches:
      - title: "Red Hat Trusted Application Pipeline"
        ci_name: "enterprise.redhat-tap-demo.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=enterprise.redhat-tap-demo.prod"
        relevance_score: 93
        why_it_fits: "Covers the full RHDH + Pipelines + GitOps + ACS + TAS + TPA + OpenShift AI DevSecOps narrative, explicitly designed for SAs to present and deliver end-to-end."
        workloads: []
      - title: "Red Hat Advanced Developer Suite - Software Supply Chain Demo"
        ci_name: "enterprise.redhat-ads-demo.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=enterprise.redhat-ads-demo.prod"
        relevance_score: 84
        why_it_fits: "Covers Developer Hub, Pipelines, GitOps, ACS, TAS, and TPA through an end-to-end supply chain narrative SAs can use to practice talking points."
        workloads:
          - role: "ocp4_workload_advanced_developer_suite"
            collection: "rhpds.ads"
      - title: "Service Enablement: App Platform Software Factory"
        ci_name: "openshift-cnv.app-platform-factory-cnv.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=openshift-cnv.app-platform-factory-cnv.prod"
        relevance_score: 82
        why_it_fits: "Hands-on enablement lab covering Developer Hub, Pipelines, GitOps, TAS, and TPA end-to-end for the same SA audience."
        workloads:
          - role: "ocp4_workload_showroom"
            collection: "agnosticd.showroom"
    catalog_gap: "No existing catalog item teaches SAs how to deliver the Advanced App Platform demo specifically — with the Parasol Insurance narrative, all 7 modules, per-section talking points, and objection handling coaching. Closest items are either full hands-on labs where participants do the work themselves, or demos covering a subset of the stack without the instructor-led enablement layer."
    rejections:
    - id: 78385367-0744-4f08-aa4b-ee31a8ece517
      text: The design of this should be rewritten to be what will be done at RH1.
        Right now, it is 2.5 hours aligned to the actual demo. We shouldn't use all
        of the time with people in a physical room to just do the thing that they
        can already order via self-service.
      resolved: true
      reviewer: nstephan@redhat.com
      timestamp: '2026-08-26T09:43:55.828490+00:00'
    - id: dd96d0dd-6933-4bfe-a7a7-a815edcda940
      text: I know the title is the "Advanced App Platform" demo, but I think you
        should try to keep this at intermediate level. I think this should be advanced
        for customers, but it should be intermediate for anyone at Red Hat that is
        delivering it.
      resolved: true
      reviewer: nstephan@redhat.com
      timestamp: '2026-08-26T09:43:55.828490+00:00'
  infra:
    peak_environments: null
    cost_per_run_est: ''
    provisioning_time_est: ''
    agnosticv_base_ci: ''
    approved_by: ''
    rejections:
      - id: infra-rejection-rh1-2026-09-10
        text: >-
          Please reconsider the design of this session. In its current form, it puts too much stress
          on the infrastructure and may affect other sessions at the event. I understand that the idea
          of this lab is to show how to deliver the existing demo. However, the session room is for 100
          attendees and running 100 demos concurrently puts a lot of stress on the infrastructure.
          According to my estimation we will need to provide 57TB of RAM or about 15K cpu core to run
          one session. It is too much and may affect other sessions during the event. I am going to
          reject this request and ask you to reconsider the approach. It would be better to show how
          to run select modules of the original demo in the multi-user environment. It will be closer
          to real use case when Developer Hub is used in the multiuser mode and all corresponding
          checks and pipelines share resources of the same cluster. We can deploy a bigger cluster and,
          if necessary, a few clusters per a group of attendees.
        resolved: true
        reviewer: ''
        timestamp: '2026-09-10T00:00:00+00:00'
        resolution: >-
          Redesigned as a group format: 100 attendees in 20 groups of 5. Each group shares one
          pre-provisioned RHDP instance and one set of credentials. One group member drives at any
          time; others observe. Reduces concurrent instances from 100 to 20 — approximately 80%
          reduction in peak infrastructure load (from ~57TB RAM / ~15K cores to ~11.5TB RAM /
          ~2.9K cores).
